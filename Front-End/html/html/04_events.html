<!doctype html>
<html>
  <head>
    <title>이벤트 실습</title>
  </head>
  <body>
    <button onclick="console.log('버튼을 클릭했습니다.')">클릭해보세요.</button>
    <button ondblclick="console.log('버튼을 더블클릭했습니다.')">
      더블클릭해보세요.
    </button>
    <div
      onmouseover="console.log('마우스가 안으로 올라왔습니다.')"
      onmouseout="console.log('마우스가 바깥으로 나갔습니다.')"
    >
      마우스를 올려보세요.
    </div>
  </body>
</html>
