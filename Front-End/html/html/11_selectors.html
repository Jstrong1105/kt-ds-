<!doctype html>
<html>
  <head>
    <title>Selector 실습</title>
    <link type="text/css" rel="stylesheet" href="../css/11_selectors.css" />
  </head>
  <body>
    <!-- heading tag h1 ~ h6 -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <div id="first-div" class="tall-div">첫 번째 Div 입니다.</div>
    <div class="small-font-size">두 번째 Div 입니다.</div>

    <ul>
      <li class="italic big-font-size">첫 번째 아이템</li>
      <li class="italic big-font-size">두 번째 아이템</li>
      <li class="italic big-font-size">세 번째 아이템</li>
    </ul>
  </body>
</html>
