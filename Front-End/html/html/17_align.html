<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>
    <link type="text/css" rel="stylesheet" href="../css/17_align.css" />
  </head>
  <body>
    <div class="text-align-left">왼쪽 정렬입니다.</div>

    <div class="text-align-center">가운데 정렬입니다.</div>

    <div class="text-align-right">오른쪽 정렬입니다.</div>

    <div class="text-align-left">
      <div class="inline-box">아이템 1</div>
      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>
    </div>

    <div class="text-align-center">

      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>

    <div class="text-align-right">

      <div class="inline-box">아이템 2</div>
      <div class="inline-box">아이템 3</div>
    </div>

    <div>

        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
      <div class="vertical-align-middle">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
      <div class="vertical-align-bottom">
        <div class="box box-1"></div>
        <div class="box box-2"></div>
        <div class="box box-3"></div>
      </div>
    </div>

    <div class="aligns">
      <label for="user-email">User Email</label>
      <input type="email" name="" id="user-email" />

      <label for="user-password"></label>
      <input type="password" name="" id="user-password" />

      <input type="checkbox" name="" id="" />
      <img

      />
