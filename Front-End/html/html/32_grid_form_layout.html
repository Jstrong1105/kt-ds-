<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Grid Form Layout</title>
    <link
      rel="stylesheet"
      href="../css/32_grid_form_layout.css"
      type="text/css"
    />
  </head>
  <body>
    <div class="grid-form">
      <label for="a">A</label>
      <input type="text" id="a" />
      <label for="b">B</label>
      <input type="text" id="b" />
      <label for="c">C</label>
      <input type="text" id="c" />
      <label for="d">D</label>
      <input type="text" id="d" />
      <label for="e">E</label>
      <input type="text" id="e" />
      <label for="f">F</label>
      <input type="text" id="f" />
      <label for="g">G</label>
      <input type="text" id="g" />

      <div class="button-area">
        <button class="modify-button">수정</button>
        <button class="add-button">추가</button>
      </div>
    </div>
  </body>
</html>
