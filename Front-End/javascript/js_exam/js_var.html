<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!--
     Javascript는 웹페이지에서 단독 실행이 불가능하다. 
     반드시 HTML 파일을 통해서 동작이 이루어지도록 해야 한다.
     그 이유는 Javascript 역할 때문.
     Javascript의 역할
        - 1. 사용자의 Event에 대응한다. (클릭, 더블클릭, 외부정보 조회)
        - 2. 비동기 처리를 위해 (네트워크 통신을 위해)
        - 3. 선형 이벤트 처리를 위해 (시간을 재거나, 특정 주기로 반복)
        ==> HTML 파일을 역동적으로 표현하기 위해 사용된다.
     -->
    <script type="text/javascript" src="./js_var.js"></script>
  </head>
  <body></body>
</html>
